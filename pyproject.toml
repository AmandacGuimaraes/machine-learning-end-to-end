[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "machine-learning-end-to-end"
version = "0.1.0"
description = "Template reproduzivel para classificacao tabular"
requires-python = ">=3.11,<3.14"
dependencies = ["pandas>=2.1", "numpy>=1.26", "scikit-learn>=1.4", "matplotlib>=3.8", "scipy>=1.11", "PyYAML>=6.0", "joblib>=1.3"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jupyter>=1.0"]
automl = ["autogluon.tabular>=1.2"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
[tool.setuptools.packages.find]
include = ["src*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
